<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Registration</title>

<link rel="stylesheet" href="./style.css">

</head>


<body>


<div class="register-container">


<h1>User Registration</h1>


<form id="registerForm" novalidate>


<label for="name">Full Name</label>

<input type="text" id="name" placeholder="Enter your name" required>

<small id="nameError"></small>



<label for="email">Email</label>

<input type="email" id="email" placeholder="Enter your email" required>

<small id="emailError"></small>



<label for="phone">Phone Number</label>

<input type="tel" id="phone" inputmode="numeric" autocomplete="tel" placeholder="Enter phone number" required>

<small id="phoneError"></small>



<label for="password">Password</label>

<div class="password-input-wrap">
    <input type="password" id="password" autocomplete="new-password" placeholder="Enter password" required>
    <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">
        <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4-.8"/></svg>
    </button>
</div>

<small id="passwordError"></small>



<label for="confirmPassword">Confirm Password</label>

<div class="password-input-wrap">
    <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Confirm password" required>
    <button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show confirm password" aria-pressed="false">
        <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4-.8"/></svg>
    </button>
</div>

<small id="confirmPasswordError"></small>



<button type="submit">

Register

</button>


<p id="successMessage"></p>


</form>
<p>
        Already have an account?
        <a href="../loginpage/login.html">
            Login
        </a>
    </p>

</div>



<script src="./register.js"></script>


</body>

</html>
